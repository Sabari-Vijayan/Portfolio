name: Update Blog Knowledge

on:
  schedule:
    - cron: '0 0 1 * *' # Every 1st of the month
  workflow_dispatch:

jobs:
  update-blogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install rss-parser
        run: npm install rss-parser

      - name: Run Blog Sync
        run: node scripts/sync-blogs.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogs.ts
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync medium blogs" && git push)
